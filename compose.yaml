name: bestcars-capstone
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand("ping").ok']
      interval: 5s
      retries: 20
  api:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    ports: ["127.0.0.1:3030:3030"]
    depends_on:
      mongo: {condition: service_healthy}
  sentiment:
    build: ./server/djangoapp/microservices
    ports: ["127.0.0.1:5050:5050"]
  web:
    build: .
    environment:
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5050
      SQLITE_PATH: /data/db.sqlite3
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    volumes: [django-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [api, sentiment]
volumes:
  mongo-data:
  django-data:
